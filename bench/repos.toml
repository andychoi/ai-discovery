# Benchmark reference repositories (roadmap M0.11, design/benchmark-protocol.md §2).
#
# Every entry is SHA-pinned. `local` is an optional checkout used when its HEAD
# equals `sha`; otherwise `python -m bench fetch` clones into
# tests/corpus/external/.cache/<id>. `ground_truth` is only scored when the
# scanned SHA equals `ground_truth_sha` (labels are made from source at that SHA).
# Existence, SHA and license verified 2026-10-11 (git ls-remote + GitHub API).
# `status = "candidate"`: pinned but not yet part of a baseline run.

[[repo]]
id = "spring-petclinic"
url = "https://github.com/spring-projects/spring-petclinic.git"
sha = "753d35c2f84432d88c0f3b61c9302a16069b78dd"   # = tests/corpus/external pin
stack = "java-spring"
license = "Apache-2.0"
local = "../sample-apps/spring-petclinic"          # owner checkout is at 500158f (newer) → fetched
ground_truth = "tests/corpus/external/ground_truth/spring-petclinic.json"
ground_truth_sha = "753d35c2f84432d88c0f3b61c9302a16069b78dd"
status = "active"

