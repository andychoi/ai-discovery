# AI-Discovery Configuration
# Customize discovery behavior, model selection, and optional features

# Provider: bedrock | ollama | mlx-gemma | mlx-qwen
provider: ollama

# LLM cost limit (USD) — stops pipeline if exceeded
budget_limit_usd: 50.0

# Max concurrent workers for parallel processing
max_concurrent: 10

# Production mode: use tier3p (deep) instead of tier3d (standard) for doc generation
prod: false

# Ollama configuration
ollama:
  base_url: "http://localhost:11434"
  tier1: "gemma4:e2b"
  tier2: "gemma4:26b"
  tier3d: "gemma4:26b"
  tier3p: "gemma4:31b"
  tier1_num_ctx: 4096

# RAG configuration
rag:
  embedding_provider: ollama
  bedrock_model: "amazon.titan-embed-text-v2:0"
  ollama_model: mxbai-embed-large
  chunk_size: 1500
  chunk_overlap: 200
  top_k: 5

# Process Mining Configuration (Stage 10.5) — OPTIONAL
# Set enabled: true to enable process mining and conformance analysis
process_mining:
  enabled: false
  miner_variant: inductive
  fitness_threshold: 0.9
  precision_threshold: 0.85
  generalization_threshold: 0.8
  max_traces: 10000
  output_reports: true

# Advisor Configuration (beta) — OPTIONAL
# Set enabled: true to enable advisor tool integration
advisor:
  enabled: false
  provider: auto
  model: claude-opus-4-7
  tiers: ['tier2', 'tier3']
  max_uses_per_call: 1
  tier3_executor_override: ""
