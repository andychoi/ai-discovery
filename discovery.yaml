# AI-Discovery Configuration
# Customize discovery behavior, model selection, and optional features

# Provider: aigw | omlx | openrouter | bedrock | ollama | mlx-gemma | mlx-qwen | openai | gemini | anthropic
provider: aigw

# Spend mode: false = structure only (no LLM calls, no key needed); true = add LLM prose
prose: false

# LLM cost limit (USD) — stops pipeline if exceeded
budget_limit_usd: 50.0

# Max concurrent workers for parallel processing
max_concurrent: 10

# Quality: draft = documents use the standard model (cheap); final = deep model + source verification
quality: draft

# Model per role for the active provider; empty = the provider's default (see its section)
models:
  fast: ""
  standard: ""
  deep: ""

# Local ai-gateway (OpenAI-compatible, fronts OMLX) — set AIGW_API_KEY in the
# environment. Models are gateway aliases; the key must allowlist each one.
aigw:
  base_url: "http://localhost:11433/v1"
  fast: claude-haiku
  standard: claude-sonnet
  deep: claude-opus

# RAG configuration
# embedding_model: model for embedding_provider (empty = provider default)
rag:
  embedding_provider: aigw
  embedding_model: ""
  bedrock_model: "amazon.titan-embed-text-v2:0"
  ollama_model: mxbai-embed-large
  chunk_size: 1500
  chunk_overlap: 200
  top_k: 5

# Snapshot retention: completed scans kept in the index (the current one is always kept)
store:
  keep_snapshots: 3

# Which files a scan reads (M6.1); .gitignore and .discoveryignore always apply.
# Add gitignore-syntax excludes with  exclude: ["**/Scripts/vendor/**"]
scan:
  max_file_kb_source: 2048
  max_file_kb_other: 500
  submodules: false

# Flow Statistics Configuration (Phase 16) — OPTIONAL
# Set enabled: true to enable per-scenario flow statistics reports
process_mining:
  enabled: false
  max_traces: 10000
  output_reports: true

# Advisor Configuration (beta) — OPTIONAL
# Set enabled: true to enable advisor tool integration
advisor:
  enabled: false
  provider: auto
  model: claude-opus-4-7
  tiers: ['tier2', 'tier3']
  max_uses_per_call: 1
  tier3_executor_override: ""
