# Accuracy gate on real repositories (roadmap item M6.13, design/benchmark-protocol.md).
# Scans the SHA-pinned repos in bench/repos.toml and checks graded precision per
# language × origin and key-edge recall per repo. Weekly and on demand; the sealed
# hard-case split runs only when requested (milestone gates), never on pull requests.
name: accuracy

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      sealed:
        description: "Also score the sealed hard-case split (milestone gate)"
        type: boolean
        default: false

jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Cache pinned repositories
        uses: actions/cache@v4
        with:
          path: tests/corpus/external/.cache
          key: bench-repos-${{ hashFiles('bench/repos.toml') }}
      - name: Accuracy gate (external)
        run: |
          args="--external --fetch --json"
          if [ "${{ inputs.sealed }}" = "true" ]; then args="$args --sealed"; fi
          .venv/bin/python -m bench gate $args > gate.json || status=$?
          cat gate.json
          exit ${status:-0}
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accuracy-gate
          path: gate.json
