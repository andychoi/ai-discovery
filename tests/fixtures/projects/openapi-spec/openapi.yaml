openapi: 3.0.0
info:
  title: Pet API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
    post:
      operationId: createPet
      summary: Create a pet
  /pets/{petId}:
    get:
      operationId: getPet
    delete:
      operationId: deletePet
