[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-discovery"
version = "0.1.0"
description = "Brownfield codebase analysis and SDLC document generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Claude"},
]
keywords = ["code-analysis", "documentation", "reverse-engineering", "codebase"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Documentation",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Floors verified by tests/test_ts_floor.py (0.24 lacks QueryCursor).
    # <0.26: 0.26.0 segfaults in QueryCursor.matches on real C# (eShop
    # CatalogApi.cs; tests/fixtures/regressions/ts026-segfault).
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-python>=0.23.6",
    "tree-sitter-javascript>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "typer[all]>=0.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "boto3>=1.35",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pysqlite3",
    "sqlite-vec>=0.1",
    "scikit-learn>=1.4",
    "networkx>=3.0",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
advisor = [
    "anthropic>=0.50.0",  # Required only for native Anthropic advisor tool
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
discover = "ai_discovery.cli:main"

[tool.pytest.ini_options]
markers = [
    "accuracy: corpus-based extraction accuracy gate (deterministic, no LLM/network)",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
ai_discovery = ["**/*.yaml", "**/*.j2", "**/*.html", "**/*.css", "**/*.js", "server/static/**/*"]
